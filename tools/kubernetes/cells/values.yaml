## @param externalGrpcAuthzMiddleware.enabled Enable Istio EnvoyFilter with ext_authz middleware and LUA preprocessing/postprocessing.
## @param externalGrpcAuthzMiddleware.extAuthz.grpcService.clusterName Upstream gRPC cluster name used by ext_authz filter.
externalGrpcAuthzMiddleware:
  enabled: false
  name: cells-wire-authz
  annotations: {}
  workloadSelector: {}
  extAuthz:
    grpcService:
      # Example: outbound|9000||cells-auth-middleware.cells.svc.cluster.local
      clusterName: ""
  configPatches:
    - applyTo: CLUSTER
      match:
        context: ANY
        cluster:
          service: "{{ include \"common.names.fullname\" . }}"
      patch:
        operation: MERGE
        value:
          lb_policy: RING_HASH
          ring_hash_lb_config:
            hash_function: XX_HASH
          load_balancing_policy:
            typed_extension_config:
              name: envoy.load_balancing_policies.ring_hash
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.load_balancing_policies.ring_hash.v3.RingHash
                hash_function: XX_HASH
                hash_policy:
                  - cookie:
                      name: SESSIONID
                      ttl: 3600s
                      path: /
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.stateful_session
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.stateful_session.v3.StatefulSession
            session_state:
              name: envoy.http.stateful_session.cookie
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.http.stateful_session.cookie.v3.CookieBasedSessionState
                cookie:
                  name: SESSIONID
                  path: /
                  ttl: 3600s
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
      patch:
        operation: INSERT_BEFORE
        filterClass: AUTHZ
        value:
          name: envoy.filters.http.ext_authz
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            grpc_service:
              envoy_grpc:
                cluster_name: "{{ .Values.externalGrpcAuthzMiddleware.extAuthz.grpcService.clusterName }}"
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: |
              function envoy_on_request(handle)
                local path = handle:headers():get(":path")
                if handle:headers():get("x-authentication-methods") then
                  handle:logWarn("Spoof attempt: client sent x-authentication-methods header")
                  handle:headers():remove("x-authentication-methods")
                end
                if handle:headers():get("x-team-extraction-methods") then
                  handle:logWarn("Spoof attempt: client sent x-team-extraction-methods header")
                  handle:headers():remove("x-team-extraction-methods")
                end
                if handle:headers():get("z-user") then
                  handle:logWarn("Spoof attempt: client sent z-user header")
                  handle:headers():remove("z-user")
                end
                if handle:headers():get("z-team") then
                  handle:logWarn("Spoof attempt: client sent z-team header")
                  handle:headers():remove("z-team")
                end

                if path:find("^/v2") then
                  handle:headers():add("x-authentication-methods", "bearer")
                elseif path:find("^/io") or path:find("^/data") then
                  handle:headers():add("x-authentication-methods", "hmac,passthrough")
                  handle:headers():add("x-team-extraction-methods", "param=teamID")
                elseif path:find("^/pub/a/") then
                  handle:headers():add("x-authentication-methods", "passthrough")
                elseif path:find("^/pub") then
                  handle:headers():add("x-authentication-methods", "passthrough")
                  handle:headers():add("x-team-extraction-methods", "path=pub")
                elseif path:find("^/v1") then
                  handle:headers():add("x-authentication-methods", "passthrough")
                else
                  handle:headers():add("x-authentication-methods", "passthrough")
                end
              end
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: INSERT_AFTER
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: |
              function envoy_on_request(handle)
                local metadata = handle:streamInfo():dynamicMetadata()
                local ext_authz = metadata:get("envoy.filters.http.ext_authz")
                if ext_authz ~= nil then
                  local new_path = ext_authz["rewrite_path"]
                  if new_path ~= nil then
                    handle:logInfo("Rewriting path to: " .. new_path)
                    handle:headers():replace(":path", new_path)
                  else
                    handle:logInfo("No 'rewrite_path' found in ext_authz metadata.")
                  end
                else
                  handle:logInfo("No 'envoy.ext_authz' dynamic metadata found.")
                end
              end
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
      patch:
        operation: MERGE
        value:
          response_headers_to_remove:
            - x-envoy-upstream-service-time
