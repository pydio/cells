{{- if (include "cells.ingress.enabled" .) }}
{{- if .Values.ingress.secrets }}
{{- range .Values.ingress.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "cells.labels" $ | nindent 4 }}
    {{- if $.Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" $.Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $.Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .certificate | b64enc }}
  tls.key: {{ .key | b64enc }}
---
{{- end }}
{{- end }}
{{- if (include "cells.ingress.tls.enabled" .) }}
{{- $ca := genCA "cells-ca" 365 }}
{{- $cert := genSignedCert (include "cells.ingress.hostname" .) nil (list (include "cells.ingress.hostname" .)) 365 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-tls" (include "cells.ingress.hostname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "cells.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
---
{{- end }}
{{- end }}
{{- if and (include "cells.tls.enabled" .) (include "cells.tls.autoGenerated" .) (not (include "cells.tls.selfSigned" .)) -}}
{{ include "cells.tls.generateCertificates" (dict "name" "cells" "context" .) -}}
---
{{- end }}
{{- $ := .}}
{{- range $listener := .Values.gatewayAPI.gateway.listeners }}
{{- $listenerData := default dict $listener -}}
{{- $listenerTls := default dict (get $listenerData "tls") -}}
{{- if and $.Values.gatewayAPI.enabled $listenerTls.enabled -}}
{{- $listenerName := get $listenerData "name" -}}
{{- $listenerHostname := get $listenerData "hostname" -}}
{{- $listenerTlsSecretName := default (printf "%s-gateway-%s-tls" (include "cells.fullname" $) $listenerName) $listenerTls.existingSecret -}}
{{- $listenerAutoGenerated := default dict (get $listenerTls "autoGenerated") -}}
{{- $listenerCertManager := default dict (get $listenerAutoGenerated "certManager") -}}
{{- if $listenerTls.selfSigned }}
{{- $cert := genSelfSignedCert $listenerHostname nil nil 3650 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $listenerTlsSecretName }}
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "cells.labels" $ | nindent 4 }}
    {{- if $.Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" $.Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $.Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
---
{{- else if and $listenerAutoGenerated.enabled (eq ($listenerAutoGenerated.engine | default "helm") "helm") }}
{{- $ca := genCA (printf "%s-gateway-%s-ca" (include "cells.fullname" $) $listenerName) 365 }}
{{- $cert := genSignedCert $listenerHostname nil (list $listenerHostname) 365 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $listenerTlsSecretName }}-tls
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "cells.labels" $ | nindent 4 }}
    {{- if $.Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" $.Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $.Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
---
{{- else if and $listenerAutoGenerated.enabled (eq $listenerAutoGenerated.engine "cert-manager") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-gateway-%s-tls" (include "cells.fullname" $) $listenerName }}
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "cells.labels" $ | nindent 4 }}
    {{- if $.Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" $.Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $.Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ $listenerTlsSecretName }}
  commonName: {{ $listenerHostname | quote }}
  dnsNames:
    - {{ $listenerHostname | quote }}
  privateKey:
    algorithm: {{ $listenerCertManager.keyAlgorithm | default "RSA" }}
    size: {{ $listenerCertManager.keySize | default 2048 }}
  duration: {{ $listenerCertManager.duration | default "2160h" }}
  renewBefore: {{ $listenerCertManager.renewBefore | default "360h" }}
  issuerRef:
    name: {{ required (printf "gatewayAPI listener %s tls.autoGenerated.certManager.existingIssuer is required when engine=cert-manager" $listenerName) $listenerCertManager.existingIssuer }}
    kind: {{ $listenerCertManager.existingIssuerKind | default "Issuer" }}
{{- if $listenerCertManager.existingIssuerGroup }}
    group: {{ $listenerCertManager.existingIssuerGroup }}
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
