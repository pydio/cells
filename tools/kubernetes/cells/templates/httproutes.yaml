{{- if .Values.useGatewayAPI }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cells-main-route
spec:
  parentRefs:
    - name: cells-gateway
      kind: Gateway
  hostnames:
    - "cluster.pydiocells.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pub/a/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /a/
      backendRefs:
        - name: cells
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cells
          port: 8080
{{- end }}