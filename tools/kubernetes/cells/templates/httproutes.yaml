{{- if .Values.gatewayAPI.enabled }}
{{- $ := . }}
{{- range $route := .Values.gatewayAPI.gateway.routes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "cells.fullname" $ }}
spec:
  parentRefs:
    - name: {{ $.Values.gatewayAPI.gateway.name | default (include "cells.fullname" $) }}
      kind: Gateway
  hostnames:
    {{ toYaml $route.hostnames }}
  rules:
    {{ toYaml $route.rules | nindent 4 }}
{{- end }}
{{- end }}