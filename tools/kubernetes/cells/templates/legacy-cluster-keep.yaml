{{- $migration := default dict .Values.migration }}
{{- $check := default dict $migration.legacyDependenciesCheck }}
{{- $orphanBundleBackups := default false $migration.orphanBundleBackups }}
{{- if and .Release.IsUpgrade $orphanBundleBackups }}
{{- $appNames := default (list "cert-manager" "collabora-online" "etcd" "ingress-nginx" "mariadb" "mariadb-galera" "minio" "mongodb" "nats" "redis" "vault" "vault-agent-injector") $check.appNames }}
{{- $chartPrefixes := default (list "cert-manager" "collabora-online" "etcd" "ingress-nginx" "mariadb" "mariadb-galera" "minio" "mongodb" "nats" "redis" "vault") $check.chartPrefixes }}
{{- $enabledDependencies := dict }}
{{- if (index (default dict (index .Values "cert-manager")) "enabled") }}{{- $_ := set $enabledDependencies "cert-manager" true }}{{- end }}
{{- if (index (default dict .Values.collabora) "enabled") }}{{- $_ := set $enabledDependencies "collabora-online" true }}{{- end }}
{{- if (index (default dict .Values.etcd) "enabled") }}{{- $_ := set $enabledDependencies "etcd" true }}{{- end }}
{{- if (index (default dict .Values.ingress) "enabled") }}{{- $_ := set $enabledDependencies "ingress-nginx" true }}{{- end }}
{{- if (index (default dict .Values.mariadb) "enabled") }}{{- $_ := set $enabledDependencies "mariadb" true }}{{- end }}
{{- if (index (default dict (index .Values "mariadb-galera")) "enabled") }}{{- $_ := set $enabledDependencies "mariadb-galera" true }}{{- end }}
{{- if (index (default dict .Values.minio) "enabled") }}{{- $_ := set $enabledDependencies "minio" true }}{{- end }}
{{- if (index (default dict .Values.mongodb) "enabled") }}{{- $_ := set $enabledDependencies "mongodb" true }}{{- end }}
{{- if (index (default dict .Values.nats) "enabled") }}{{- $_ := set $enabledDependencies "nats" true }}{{- end }}
{{- if (index (default dict .Values.redis) "enabled") }}{{- $_ := set $enabledDependencies "redis" true }}{{- end }}
{{- if (index (default dict .Values.vault) "enabled") }}{{- $_ := set $enabledDependencies "vault" true }}{{- $_ := set $enabledDependencies "vault-agent-injector" true }}{{- end }}
{{- $clusterResources := list
  (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "ClusterRole")
  (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "ClusterRoleBinding")
  (dict "apiVersion" "networking.k8s.io/v1" "kind" "IngressClass")
  (dict "apiVersion" "admissionregistration.k8s.io/v1" "kind" "MutatingWebhookConfiguration")
  (dict "apiVersion" "admissionregistration.k8s.io/v1" "kind" "ValidatingWebhookConfiguration")
  (dict "apiVersion" "apiextensions.k8s.io/v1" "kind" "CustomResourceDefinition")
}}
{{- range $resource := $clusterResources }}
{{- $apiVersion := index $resource "apiVersion" }}
{{- $kind := index $resource "kind" }}
{{- $lookup := lookup $apiVersion $kind "" "" }}
{{- range $item := default list $lookup.items }}
{{- $metadata := default dict $item.metadata }}
{{- $labels := default dict $metadata.labels }}
{{- $annotations := default dict $metadata.annotations }}
{{- $instance := default "" (index $labels "app.kubernetes.io/instance") }}
{{- $releaseLabel := default "" (index $labels "release") }}
{{- $ownedByRelease := and (eq (default "" (index $annotations "meta.helm.sh/release-name")) $.Release.Name) (eq (default "" (index $annotations "meta.helm.sh/release-namespace")) $.Release.Namespace) (eq (default "" (index $labels "app.kubernetes.io/managed-by")) $.Release.Service) }}
{{- if and $ownedByRelease (or (eq $instance $.Release.Name) (eq $releaseLabel $.Release.Name)) }}
{{- $appName := default "" (index $labels "app.kubernetes.io/name") }}
{{- $chart := default "" (index $labels "helm.sh/chart") }}
{{- $dependencyName := "" }}
{{- range $appNames }}
{{- if eq $appName . }}{{- $dependencyName = . }}{{- end }}
{{- end }}
{{- range $chartPrefixes }}
{{- if hasPrefix (printf "%s-" .) $chart }}{{- $dependencyName = . }}{{- end }}
{{- end }}
{{- if and $dependencyName (not (hasKey $enabledDependencies $dependencyName)) }}
---
apiVersion: {{ $apiVersion }}
kind: {{ $kind }}
metadata:
  name: {{ $metadata.name | quote }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace | quote }}
    helm.sh/resource-policy: keep
{{- if eq $kind "ClusterRole" }}
{{- with $item.aggregationRule }}
aggregationRule:
  {{- toYaml . | nindent 2 }}
{{- end }}
rules:
  {{- toYaml (default list $item.rules) | nindent 2 }}
{{- else if eq $kind "ClusterRoleBinding" }}
roleRef:
  {{- toYaml $item.roleRef | nindent 2 }}
subjects:
  {{- toYaml (default list $item.subjects) | nindent 2 }}
{{- else if eq $kind "IngressClass" }}
spec:
  {{- toYaml (default dict $item.spec) | nindent 2 }}
{{- else if or (eq $kind "MutatingWebhookConfiguration") (eq $kind "ValidatingWebhookConfiguration") }}
webhooks:
  {{- toYaml (default list $item.webhooks) | nindent 2 }}
{{- else if eq $kind "CustomResourceDefinition" }}
spec:
  {{- toYaml $item.spec | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
