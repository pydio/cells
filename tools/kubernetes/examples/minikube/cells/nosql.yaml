externalNoSQLDatabase:
  enabled: true
  host: mongodb-svc.cells.svc.cluster.local
  scheme: mongodb
  port: 27017
  tls:
    enabled: false
    client:
      existingSecret: "mongodb-tls"
      cert: "tls.crt"
      key: "tls.key"
    ca:
      existingSecret: "pydio-root-ca"
      cert: "ca.crt"
    autoGenerated: false
  auth:
    enabled: true
    # user: "cells"
    # password: "cells"
    existingSecret: mongodb-cells-secret
    existingSecretUsernameKey: "username"
    existingSecretPasswordKey: "password"
  params:
    authSource: "admin"

