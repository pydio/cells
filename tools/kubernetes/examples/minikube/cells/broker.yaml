externalBroker:
  enabled: true
  host: nats.cells.svc.cluster.local
  port: 4222
  auth:
    enabled: false
    user: "nats"
    password: ""
    existingSecret: nats
    existingSecretServerConf: nats-server.conf
    existingSecretUsernameKey: ""
    existingSecretPasswordKey: ""
  tls:
    enabled: false
    autoGenerated: false
    client:
      existingSecret: "nats-client-crt"
      cert: "tls.crt"
      key: "tls.key"
    ca:
      existingSecret: "nats-ca-crt"
      cert: "tls.crt"