externalDiscovery:
  enabled: true
  host: etcd.cells.svc.cluster.local
  port: 2379
  tls:
    enabled: false
    autoGenerated: false
    client:
      existingSecret: ""
      cert: "tls.crt"
      key: "tls.key"
    ca:
      existingSecret: ""
      cert: "ca.crt"
  auth:
    enabled: false
    user: "root"
    password: ""
    existingSecret: "etcd"
    existingSecretPasswordKey: "etcd-root-password"