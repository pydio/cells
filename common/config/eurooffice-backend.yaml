# Euro-Office Backend Configuration
# Settings for Euro-Office WOPI server integration

services:
  pydio.grpc.editor:
    eurooffice:
      # WOPI server endpoint
      wopi_server: "http://localhost:8080/wopi"
      # Authentication token for WOPI requests
      auth_token: "${EUROOFFICE_WOPI_TOKEN:-}"
      # Proof key validation
      validate_proof: true
      # Proof key cache TTL
      proof_cache_ttl: 3600
      # Maximum request size (bytes)
      max_request_size: 10485760
      # Request timeout (seconds)
      request_timeout: 30
      # Retry attempts
      retry_attempts: 3
      # Retry delay (seconds)
      retry_delay: 1
      # Connection pool size
      connection_pool_size: 20
      # TLS verification
      tls_verify: true
      # Connection keep-alive
      keep_alive: true

# Frontend configuration for Euro-Office editor
frontend:
  plugin:
    editor:
      eurooffice:
        # Editor configuration
        editor_url: "http://localhost:8080/editor"
        # Language resources URL
        i18n_url: "http://localhost:8080/i18n"
        # Assets URL
        assets_url: "http://localhost:8080/assets"
        # API endpoint for document operations
        api_url: "/api/v2/documents"
        # WebSocket endpoint for real-time collaboration
        websocket_url: "ws://localhost:8080/ws"
        # Maximum simultaneous connections
        max_connections: 100
        # Session renewal interval (seconds)
        session_renewal: 300
        # Performance settings
        enable_lazy_loading: true
        enable_cache: true
        cache_ttl: 300